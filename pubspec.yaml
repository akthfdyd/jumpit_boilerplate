name: jumpit_boilerplate
description: jumpit app architecture

publish_to: 'none'

version: 1.0.2+4

environment:
  sdk: ">=2.16.1 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # section: architecture component
  arc:
    git: https://github.com/akthfdyd/arc.git
  #    path: ../arc
  get_it: ^7.2.0

  # section: network
  http: 1.2.2

  # section: ui
  cupertino_icons: ^1.0.2

  # section: flutter compiler
  flutter_eval: ^0.7.6
  dart_eval: ^0.7.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^1.0.0


flutter:
  uses-material-design: true

  assets:
    - mockdata/